name: ticketing_data_platform
version: "1.0.0"
config-version: 2

profile: ticketing_dwh

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# dwh models materialize as tables (fact_sales/dim_resellers are read by
# every datamart model, not worth recomputing per query); dwh/staging/
# overrides back to view -- it's a thin cast/join layer over raw, cheap to
# recompute, no reason to persist a copy. datamart models materialize as
# tables in the plain `datamart` schema (see
# macros/generate_schema_name.sql -- without it this would land in
# `dwh_datamart` instead).
models:
  ticketing_data_platform:
    dwh:
      +materialized: table
      staging:
        +materialized: view
    datamart:
      +materialized: table
      +schema: datamart
